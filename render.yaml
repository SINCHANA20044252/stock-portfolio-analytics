# Render Blueprint: API + PostgreSQL. Secrets marked sync:false are entered in the Render dashboard.
services:
  - type: web
    name: portfolio-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - { key: ENV, value: production }
      - { key: SECRET_KEY, generateValue: true }
      - { key: DATABASE_URL, fromDatabase: { name: portfolio-db, property: connectionString } }
      - { key: CORS_ORIGINS, sync: false }      # e.g. https://your-app.vercel.app
      - { key: COOKIE_SECURE, value: "true" }
      - { key: TRUST_PROXY, value: "true" }
      - { key: MARKET_DATA_PROVIDER, value: yahoo }
      - { key: GEMINI_API_KEY, sync: false }
databases:
  - name: portfolio-db
    plan: free
